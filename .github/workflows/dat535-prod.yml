name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  schedule:
    # The morning after each UTC day: hour 23 closes at 00:00 and is gzipped right after.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      bronze_date:
        description: UTC day to (re)run Bronze for, YYYY-MM-DD (empty = yesterday)
        required: false
        default: ''

env:
  DAT535_ENV: prod
  SPARK_HOME: /opt/spark
  JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

jobs:
  deploy-prod:
    name: Deploy to Production
    # Code changes only: needs manual approval through the `main` environment.
    if: github.event_name == 'push'
    runs-on: self-hosted
    environment: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test collector
        run: python3 -m unittest discover -s collector/tests

      - name: Test pipeline
        run: |
          source ~/spark-env/bin/activate
          python -m unittest discover -s pipeline/tests -v

      - name: Deploy collector
        # Copies collector/ to ~/dat535-collector and (re)starts the systemd user units.
        # The receiver only restarts when its code changed.
        run: collector/deploy.sh

  bronze:
    name: Bronze
    # Daily schedule or manual rerun of one day. No approval: it runs code already on main
    # and only writes its own output directory.
    if: github.event_name != 'push'
    runs-on: self-hosted
    concurrency:
      group: dat535-prod-bronze
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve directories
        id: dirs
        # Landing comes from the collector's env file, so both always agree (read-only for
        # Bronze). Output goes next to it on the data volume, separate per environment.
        run: |
          landing=$(sed -n 's/^DAT535_LANDING_DIR=//p' ~/.config/dat535/collector.env)
          if [ -z "$landing" ]; then echo "DAT535_LANDING_DIR not set in collector.env"; exit 1; fi
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          echo "output=$(dirname "$landing")/prod" >> "$GITHUB_OUTPUT"

      - name: Run Bronze
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
          BRONZE_DATE: ${{ github.event.inputs.bronze_date }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          # One Spark job at a time on the 8 GB VM (dev and prod share it): wait, never overlap.
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/bronze.py ${BRONZE_DATE:+--date "$BRONZE_DATE"}

      - name: Run Bronze DATEX
        # Its own step, run even if SIRI Bronze failed: one source must not hide the other.
        if: ${{ !cancelled() && steps.dirs.outcome == 'success' }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
          BRONZE_DATE: ${{ github.event.inputs.bronze_date }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          # One Spark job at a time on the 8 GB VM (dev and prod share it): wait, never overlap.
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/bronze_datex.py ${BRONZE_DATE:+--date "$BRONZE_DATE"}

      - name: Upload Bronze run records
        # Only the small run records; the Parquet data stays on the VM.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prod-bronze-runs-${{ github.run_number }}
          path: ${{ steps.dirs.outputs.output }}/bronze/_runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        env:
          OUT: ${{ steps.dirs.outputs.output }}
        run: |
          echo "## Bronze run" >> "$GITHUB_STEP_SUMMARY"
          # This attempt's records: <run id>.json (SIRI) and <run id>.datex.json. `|| true`: the
          # shell runs with -e, and no record at all must still reach the fallback below.
          records=$(ls "$OUT"/bronze/_runs/date=*/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.*json 2>/dev/null || true)
          if [ -n "$records" ]; then
            for r in $records; do
              echo "### $(basename "$r")" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$r" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No run record written." >> "$GITHUB_STEP_SUMMARY"
          fi
