name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  schedule:
    # The morning after each UTC day: hour 23 closes at 00:00 and is gzipped right after.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      bronze_date:
        description: UTC day to (re)run Bronze for, YYYY-MM-DD (empty = yesterday)
        required: false
        default: ''
      silver_date:
        description: Norwegian operating day to (re)run Entur Silver for (empty = two days ago; skipped for Bronze-only reruns)
        required: false
        default: ''
      gold_backfill:
        description: Run Gold for every ready schema-2 Silver day missing up-to-date schema-3 Gold (skips Bronze and Silver)
        required: false
        type: boolean
        default: false

env:
  DAT535_ENV: prod
  SPARK_HOME: /opt/spark
  JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

jobs:
  deploy-prod:
    name: Deploy to Production
    # Code changes only: needs manual approval through the `main` environment.
    if: github.event_name == 'push'
    runs-on: self-hosted
    environment: main

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test collector
        run: python3 -m unittest discover -s collector/tests

      - name: Test pipeline
        run: |
          source ~/spark-env/bin/activate
          flock -w 10800 /data/dat535/.spark.lock python -m unittest discover -s pipeline/tests -v

      - name: Deploy collector
        # Copies collector/ to ~/dat535-collector and (re)starts the systemd user units.
        # The receiver only restarts when its code changed.
        run: collector/deploy.sh

  bronze:
    name: Bronze, Silver and Gold
    # Daily schedule or manual rerun of one day. No approval: it runs code already on main
    # and only writes its own output directory.
    if: github.event_name != 'push'
    runs-on: self-hosted
    concurrency:
      group: dat535-prod-bronze
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve directories
        id: dirs
        # Landing comes from the collector's env file, so both always agree (read-only for
        # Bronze). Output goes next to it on the data volume, separate per environment.
        run: |
          landing=$(sed -n 's/^DAT535_LANDING_DIR=//p' ~/.config/dat535/collector.env)
          if [ -z "$landing" ]; then echo "DAT535_LANDING_DIR not set in collector.env"; exit 1; fi
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          echo "output=$(dirname "$landing")/prod" >> "$GITHUB_OUTPUT"

      - name: Run Bronze
        id: entur_bronze
        if: ${{ !cancelled() && steps.dirs.outcome == 'success' && github.event.inputs.gold_backfill != 'true' }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
          BRONZE_DATE: ${{ github.event.inputs.bronze_date }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          # One Spark job at a time on the 8 GB VM (dev and prod share it): wait, never overlap.
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/bronze.py ${BRONZE_DATE:+--date "$BRONZE_DATE"}

      - name: Run Bronze DATEX
        # Its own step, run even if SIRI Bronze failed: one source must not hide the other.
        id: datex_bronze
        if: ${{ !cancelled() && steps.dirs.outcome == 'success' && github.event.inputs.gold_backfill != 'true' }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
          BRONZE_DATE: ${{ github.event.inputs.bronze_date }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          # One Spark job at a time on the 8 GB VM (dev and prod share it): wait, never overlap.
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/bronze_datex.py ${BRONZE_DATE:+--date "$BRONZE_DATE"}

      - name: Run DATEX Silver
        # A UTC observation day: yesterday, or silver_date on a manual run. Independent of Entur.
        if: ${{ !cancelled() && github.event.inputs.gold_backfill != 'true' && steps.datex_bronze.outcome == 'success' && (github.event_name == 'schedule' || github.event.inputs.silver_date != '' || github.event.inputs.bronze_date == '') }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
          SILVER_DATE: ${{ github.event.inputs.silver_date }}
        run: |
          source ~/spark-env/bin/activate
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/silver_datex.py ${SILVER_DATE:+--date "$SILVER_DATE"}

      - name: Run Entur Silver
        # ET spans adjacent UTC days. Today's Bronze completes the following day
        # for Silver's default operating day (two days ago). A manual Bronze-only
        # backfill must not unexpectedly rebuild a different Silver day.
        id: entur_silver
        if: ${{ !cancelled() && github.event.inputs.gold_backfill != 'true' && steps.entur_bronze.outcome == 'success' && (github.event_name == 'schedule' || github.event.inputs.silver_date != '' || github.event.inputs.bronze_date == '') }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
          SILVER_DATE: ${{ github.event.inputs.silver_date }}
        run: |
          source ~/spark-env/bin/activate
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/silver.py ${SILVER_DATE:+--date "$SILVER_DATE"}

      - name: Run Gold
        # Same operating day as Entur Silver (default: two days ago), or --all-missing on a
        # gold_backfill dispatch. Missing DATEX Silver skips departure_conditions cleanly.
        if: ${{ !cancelled() && (github.event.inputs.gold_backfill == 'true' || (steps.entur_silver.outcome == 'success' && (github.event_name == 'schedule' || github.event.inputs.silver_date != '' || github.event.inputs.bronze_date == ''))) }}
        env:
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          SILVER_DATE: ${{ github.event.inputs.silver_date }}
          GOLD_BACKFILL: ${{ github.event.inputs.gold_backfill }}
        run: |
          source ~/spark-env/bin/activate
          if [ "$GOLD_BACKFILL" = "true" ]; then
            flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/gold.py --all-missing
          else
            flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/gold.py ${SILVER_DATE:+--date "$SILVER_DATE"}
          fi

      - name: Upload Gold run records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prod-gold-runs-${{ github.run_number }}
          path: ${{ steps.dirs.outputs.output }}/gold/_runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Silver run records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prod-silver-runs-${{ github.run_number }}
          path: ${{ steps.dirs.outputs.output }}/silver/_runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Bronze run records
        # Only the small run records; the Parquet data stays on the VM.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prod-bronze-runs-${{ github.run_number }}
          path: ${{ steps.dirs.outputs.output }}/bronze/_runs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        env:
          OUT: ${{ steps.dirs.outputs.output }}
        run: |
          records=$(ls \
            "$OUT"/bronze/_runs/date=*/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.*json \
            "$OUT"/silver/_runs/operating_date=*/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json \
            "$OUT"/silver/_runs/datex/observation_date=*/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json \
            "$OUT"/gold/_runs/operating_date=*/gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json \
            2>/dev/null || true)
          python3 pipeline/summary.py summary $records >> "$GITHUB_STEP_SUMMARY"
