name: DAT535 — Dev Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  run-dev:
    name: Run Dev Pipeline
    runs-on: self-hosted
    environment: dev
    env:
      DAT535_ENV: dev
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test collector
        run: python3 -m unittest discover -s collector/tests

      - name: Test pipeline
        run: |
          source ~/spark-env/bin/activate
          python -m unittest discover -s pipeline/tests -v

      - name: Resolve directories
        id: dirs
        # Landing comes from the collector's env file, so both always agree (read-only for
        # Bronze). Output goes next to it on the data volume, separate per environment.
        run: |
          landing=$(sed -n 's/^DAT535_LANDING_DIR=//p' ~/.config/dat535/collector.env)
          if [ -z "$landing" ]; then echo "DAT535_LANDING_DIR not set in collector.env"; exit 1; fi
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          echo "output=$(dirname "$landing")/dev" >> "$GITHUB_OUTPUT"

      - name: Run Bronze (yesterday, UTC)
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          python pipeline/bronze.py

      - name: Upload Bronze run records
        # Only the small run records; the Parquet data stays on the VM.
        uses: actions/upload-artifact@v7
        with:
          name: dev-bronze-runs-${{ github.run_number }}
          path: ${{ steps.dirs.outputs.output }}/bronze/_runs/
          retention-days: 7
          if-no-files-found: ignore