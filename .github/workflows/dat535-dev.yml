name: DAT535 — Dev Pipeline

on:
  push:
    # Every branch of this repo except main. Forks cannot push here, so outside code never
    # reaches the self-hosted runner. For the same reason there is no pull_request trigger.
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  run-dev:
    name: Run Dev Pipeline
    runs-on: self-hosted
    environment: dev
    env:
      DAT535_ENV: dev
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test collector
        run: python3 -m unittest discover -s collector/tests

      - name: Test pipeline
        run: |
          source ~/spark-env/bin/activate
          flock -w 10800 /data/dat535/.spark.lock python -m unittest discover -s pipeline/tests -v

      - name: Resolve directories
        id: dirs
        # Landing comes from the collector's env file, so both always agree (read-only for
        # Bronze). Output goes next to it on the data volume, separate per environment.
        run: |
          landing=$(sed -n 's/^DAT535_LANDING_DIR=//p' ~/.config/dat535/collector.env)
          if [ -z "$landing" ]; then echo "DAT535_LANDING_DIR not set in collector.env"; exit 1; fi
          echo "landing=$landing" >> "$GITHUB_OUTPUT"
          echo "output=$(dirname "$landing")/dev" >> "$GITHUB_OUTPUT"

      - name: Run Bronze (yesterday 08:00-09:00 UTC)
        id: entur_bronze
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          # One Spark job at a time on the 8 GB VM (dev and prod share it): wait, never overlap.
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/bronze.py --hours 08

      - name: Run Bronze DATEX (yesterday 08:00-09:00 UTC)
        # Its own step, run even if SIRI Bronze failed: one source must not hide the other.
        id: datex_bronze
        if: ${{ !cancelled() && steps.dirs.outcome == 'success' }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          # One Spark job at a time on the 8 GB VM (dev and prod share it): wait, never overlap.
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/bronze_datex.py --hours 08

      - name: Run DATEX Silver (partial dev sample)
        if: ${{ !cancelled() && steps.datex_bronze.outcome == 'success' }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
        run: |
          source ~/spark-env/bin/activate
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/silver_datex.py --date "$(date -u -d yesterday +%F)" --allow-partial

      - name: Run Entur Silver (partial dev sample)
        if: ${{ !cancelled() && steps.entur_bronze.outcome == 'success' }}
        env:
          DAT535_LANDING_DIR: ${{ steps.dirs.outputs.landing }}
          DAT535_OUTPUT_DIR: ${{ steps.dirs.outputs.output }}
        run: |
          source ~/spark-env/bin/activate
          # Dev Bronze covers one hour, so this output explicitly has ready=false.
          day=$(date -u -d yesterday +%F)
          flock -w 10800 "$(dirname "$DAT535_LANDING_DIR")/.spark.lock" python pipeline/silver.py --date "$day" --allow-partial

      - name: Upload Silver run records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dev-silver-runs-${{ github.run_number }}
          path: ${{ steps.dirs.outputs.output }}/silver/_runs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Bronze run records
        # Only the small run records; the Parquet data stays on the VM.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dev-bronze-runs-${{ github.run_number }}
          path: ${{ steps.dirs.outputs.output }}/bronze/_runs/
          retention-days: 7
          if-no-files-found: ignore
