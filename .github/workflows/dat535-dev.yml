name: DAT535 — Dev Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  run-dev:
    name: Run Dev Pipeline
    runs-on: self-hosted
    environment: dev
    env:
      DAT535_ENV: dev
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test collector
        run: python3 -m unittest discover -s collector/tests

      - name: Resolve output directory
        if: false  # disabled until the Spark pipeline is rebuilt (run_pipeline.py moved to labs/)
        id: output-dir
        # Persistent, non-tmp path: survives runner reboots/tmpfiles cleanup, unlike /tmp
        run: echo "dir=$HOME/spark-lab-data/dev" >> "$GITHUB_OUTPUT"

      - name: Run Lab 2 & Lab 3 Pipelines
        if: false  # disabled until the Spark pipeline is rebuilt (run_pipeline.py moved to labs/)
        env:
          DAT535_OUTPUT_DIR: ${{ steps.output-dir.outputs.dir }}
        run: |
          source ~/spark-env/bin/activate
          mkdir -p "$DAT535_OUTPUT_DIR"
          
          echo "=== Running Dev Pipeline ==="
          python $GITHUB_WORKSPACE/run_pipeline.py all

      - name: Upload Dev artifacts
        if: false  # disabled until the Spark pipeline is rebuilt (run_pipeline.py moved to labs/)
        uses: actions/upload-artifact@v7
        with:
          name: dev-outputs-${{ github.run_number }}
          path: ${{ steps.output-dir.outputs.dir }}/
          retention-days: 7
          if-no-files-found: ignore