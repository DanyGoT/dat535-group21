# Grafana for the collector (dat535-grafana.service), reached through serve_status.py at
# /grafana/. Read-only: anonymous viewers, no login form, no admin user. The datasource and
# dashboards are provisioned from this directory; change them here, not in the UI.
# Data, log, plugin and provisioning paths are set by the systemd unit.

[server]
http_addr = 127.0.0.1
http_port = 8753
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[security]
disable_initial_admin_creation = true
allow_embedding = true
disable_gravatar = true

[auth]
disable_login_form = true

[auth.basic]
enabled = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer
hide_version = true

[users]
allow_sign_up = false
allow_org_create = false

[live]
# No websockets: the stdlib proxy in serve_status.py does not carry them.
max_connections = 0

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[plugins]
# Don't download plugins at startup; only the built-in Prometheus datasource is used.
preinstall_disabled = true

[unified_alerting]
# Alerts go through monitor.py (ntfy).
enabled = false

[public_dashboards]
enabled = false

[cloud_migration]
enabled = false

[log]
mode = console
